<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành Tạo menu dọc</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            padding: 40px;
            background-color: #f4f6f9;
        }

        #menu ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #menu > ul {
            width: 140px;
        }

        #menu li {
            list-style: none;
            position: relative;
            width: 140px;
            height: 35px;
            padding: 0 15px;
            background-color: #222222;
            line-height: 35px;
            cursor: pointer;
            border-bottom: 1px solid #333333;
        }

        #menu li a {
            text-decoration: none;
            color: #ffffff;
            font-size: 14px;
            display: block;
            width: 100%;
            height: 100%;
        }

        #menu li:hover {
            background-color: #444444;
        }

        /* Menu con cấp 2 dạng dropdown bay sang phải */
        #menu li ul {
            position: absolute;
            top: 0;
            left: 140px;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }

        /* Hiển thị menu con khi hover chuột vào li cha */
        #menu li:hover > ul {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>

    <div id="menu">
        <ul>
            <li><a href="#">Trang chủ</a></li>
            <li>
                <a href="#">Sản phẩm &#9656;</a>
                <ul>
                    <li><a href="#">Laptop</a></li>
                    <li><a href="#">Điện thoại</a></li>
                    <li><a href="#">Phụ kiện</a></li>
                </ul>
            </li>
            <li>
                <a href="#">Dịch vụ &#9656;</a>
                <ul>
                    <li><a href="#">Bảo hành</a></li>
                    <li><a href="#">Sửa chữa</a></li>
                    <li><a href="#">Cài đặt</a></li>
                </ul>
            </li>
            <li><a href="#">Giới thiệu</a></li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
    </div>

</body>
</html>
